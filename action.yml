name: 'Testpulse'
description: 'Find tests that pass but verify nothing, and security tests you are missing. Static analysis for Playwright, Karate and Cucumber.'
author: 'barurb1996'
branding:
  icon: 'activity'
  color: 'purple'

inputs:
  path:
    description: 'Directory with the tests to analyse, relative to the workspace'
    required: false
    default: '.'
  fail-on-critical:
    description: 'Fail the step when critical issues are found'
    required: false
    default: 'true'
  min-score:
    description: 'Fail the step when the quality score is below this value (0 disables)'
    required: false
    default: '0'
  comment-on-pr:
    description: 'Post (and keep updating) a summary comment on pull requests. Needs pull-requests: write'
    required: false
    default: 'true'
  changed-since:
    description: 'Only report files changed versus this git ref, e.g. origin/main. Needs actions/checkout with fetch-depth: 0'
    required: false
    default: ''
  upload-sarif:
    description: 'Upload findings to GitHub code scanning as inline annotations. Needs security-events: write'
    required: false
    default: 'false'
  junit:
    description: 'JUnit XML glob (e.g. target/surefire-reports/*.xml) to include pass/fail per scenario'
    required: false
    default: ''
  api-url:
    description: 'Push results to your own self-hosted Testpulse server (https). Requires project and token'
    required: false
    default: ''
  project:
    description: 'Project slug on your Testpulse server (used with api-url)'
    required: false
    default: ''
  token:
    description: 'Project token for your Testpulse server (store it as a secret)'
    required: false
    default: ''
  testpulse-version:
    description: 'npm version range or dist-tag of the testpulse CLI to run'
    required: false
    default: '~0.3.0'

outputs:
  score:
    description: 'Quality score, 0-100'
    value: ${{ steps.run.outputs.score }}
  critical:
    description: 'Number of critical issues'
    value: ${{ steps.run.outputs.critical }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '20'

    - name: Run Testpulse
      id: run
      shell: bash
      # Inputs travel through the environment, never through string interpolation into the script.
      env:
        TP_PATH: ${{ inputs.path }}
        TP_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
        TP_MIN_SCORE: ${{ inputs.min-score }}
        TP_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        TP_CHANGED_SINCE: ${{ inputs.changed-since }}
        TP_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        TP_JUNIT: ${{ inputs.junit }}
        TP_API_URL: ${{ inputs.api-url }}
        TP_PROJECT: ${{ inputs.project }}
        TP_TOKEN: ${{ inputs.token }}
        TP_VERSION: ${{ inputs.testpulse-version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node "$GITHUB_ACTION_PATH/action/run.mjs"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' && steps.run.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: testpulse
