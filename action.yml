name: Testpulse
description: Static analysis for test suites — flags no-assertion, flaky patterns, generic names, missing awaits, CSS selectors.
author: barurb1996
branding:
  icon: activity
  color: purple

inputs:
  path:
    description: Directory containing test specs to analyze (relative to GITHUB_WORKSPACE)
    required: false
    default: ./e2e
  comment-on-pr:
    description: Post a comment on the PR with the analysis summary
    required: false
    default: 'true'
  fail-on-critical:
    description: Exit non-zero when critical issues are found
    required: false
    default: 'true'

outputs:
  score:
    description: Quality score 0-100
    value: ${{ steps.run.outputs.score }}
  critical:
    description: Number of critical issues
    value: ${{ steps.run.outputs.critical }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
        run_install: false

    - name: Install + build CLI (once per runner)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ ! -f packages/cli/dist/index.js ]; then
          pnpm install --frozen-lockfile
          pnpm --filter @testpulse/cli exec tsc
        fi

    - name: Run analyzer
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set +e
        node "${{ github.action_path }}/packages/cli/dist/index.js" "${{ inputs.path }}" | tee testpulse.out
        rc=$?
        set -e

        score=$(grep -oP 'Quality score: \K[0-9]+' testpulse.out || echo 0)
        critical=$(grep -oP 'Critical issues: \K[0-9]+' testpulse.out || echo 0)
        echo "score=$score"       >> "$GITHUB_OUTPUT"
        echo "critical=$critical" >> "$GITHUB_OUTPUT"
        echo "rc=$rc"             >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        score="${{ steps.run.outputs.score }}"
        critical="${{ steps.run.outputs.critical }}"

        {
          echo "### Testpulse report"
          echo ""
          echo "**Quality score: ${score}/100** · **Critical issues: ${critical}**"
          echo ""
          echo '<details><summary>Full output</summary>'
          echo ""
          echo '```'
          cat testpulse.out
          echo '```'
          echo ""
          echo '</details>'
        } > comment.md

        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file comment.md

    - name: Exit with analyzer status
      if: inputs.fail-on-critical == 'true'
      shell: bash
      run: |
        rc="${{ steps.run.outputs.rc }}"
        exit "$rc"
