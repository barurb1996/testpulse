name: Bug report
description: Something crashes, hangs or behaves wrongly (not a rule opinion; use the false-positive template for that)
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Testpulse version, placeholder: "npx testpulse --version" }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Node version and OS }
  - type: textarea
    id: command
    attributes: { label: Command you ran, render: bash }
    validations: { required: true }
  - type: textarea
    id: output
    attributes: { label: What happened and what you expected, description: Include the error output. Remove any secrets and private paths. }
    validations: { required: true }
