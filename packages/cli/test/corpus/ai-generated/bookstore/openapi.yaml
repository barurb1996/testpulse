openapi: 3.0.3
info: { title: Bookstore API, version: '2.1' }
servers: [ { url: 'https://api.books.example.com' } ]
security: [ { bearerAuth: [] } ]
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer } }
  schemas:
    Book:
      type: object
      required: [title, isbn, price]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        isbn: { type: string, pattern: '^[0-9]{13}$' }
        price: { type: number, minimum: 0 }
    OrderRequest:
      type: object
      required: [bookId, quantity]
      properties: { bookId: { type: string, format: uuid }, quantity: { type: integer, minimum: 1, maximum: 20 } }
paths:
  /books:
    get: { security: [], summary: Public catalogue, parameters: [ { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } } ], responses: { '200': { description: ok } } }
    post:
      summary: Add a book (admin only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Book' } } } }
      responses: { '201': { description: created }, '400': { description: invalid }, '401': { description: unauthenticated }, '403': { description: not an admin } }
  /books/{bookId}:
    parameters: [ { name: bookId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get: { security: [], summary: Get a book, responses: { '200': { description: ok }, '404': { description: not found } } }
    put:
      summary: Update a book (admin only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Book' } } } }
      responses: { '200': { description: ok }, '400': { description: invalid }, '401': { description: unauthenticated }, '403': { description: not an admin }, '404': { description: not found } }
    delete: { summary: Delete a book (admin only), responses: { '204': { description: deleted }, '401': { description: unauthenticated }, '403': { description: not an admin }, '404': { description: not found } } }
  /orders:
    post:
      summary: Place an order
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderRequest' } } } }
      responses: { '201': { description: created }, '400': { description: invalid }, '401': { description: unauthenticated }, '409': { description: out of stock } }
  /orders/{orderId}:
    parameters: [ { name: orderId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get: { summary: Get an order (buyer only), responses: { '200': { description: ok }, '401': { description: unauthenticated }, '403': { description: not the buyer }, '404': { description: not found } } }
