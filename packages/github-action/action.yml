name: 'Testpulse'
description: 'Analyse test quality and push results to your Testpulse dashboard'
branding:
  icon: 'activity'
  color: 'purple'

inputs:
  path:
    description: 'Directory containing test files (relative to repo root)'
    required: false
    default: '.'
  project:
    description: 'Project slug — must match the slug in your Testpulse dashboard'
    required: true
  api-url:
    description: 'Testpulse API base URL, e.g. https://testpulse.example.com'
    required: false
  token:
    description: 'Testpulse project token (store as a GitHub secret)'
    required: false
  min-score:
    description: 'Fail the step if quality score drops below this value (0 = disabled)'
    required: false
    default: '0'
  junit:
    description: 'JUnit XML glob, e.g. target/surefire-reports/*.xml'
    required: false
  testpulse-version:
    description: 'npm version range of the testpulse CLI to install (default: the 0.2 line)'
    required: false
    default: '~0.2.0'
  no-exit:
    description: 'Do not fail on critical issues (useful when only min-score matters)'
    required: false
    default: 'false'

outputs:
  score:
    description: 'Quality score 0–100'
    value: ${{ steps.analyse.outputs.score }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Testpulse CLI
      shell: bash
      env:
        TP_VERSION: ${{ inputs.testpulse-version }}
      run: |
        # version range comes from an input: allow only characters that can appear in a semver range
        if ! [[ "$TP_VERSION" =~ ^[0-9A-Za-z.~^*xX-]+$ ]]; then echo "::error::invalid testpulse-version"; exit 1; fi
        npm install -g "testpulse@${TP_VERSION}"

    - name: Run analysis
      id: analyse
      shell: bash
      # Inputs are passed through the environment, never interpolated into the script: a value such as a branch
      # name or path containing shell metacharacters must not be able to run commands. The token stays out of argv.
      env:
        TESTPULSE_TOKEN: ${{ inputs.token }}
        IN_PATH: ${{ inputs.path }}
        IN_PROJECT: ${{ inputs.project }}
        IN_API_URL: ${{ inputs.api-url }}
        IN_JUNIT: ${{ inputs.junit }}
        IN_NO_EXIT: ${{ inputs.no-exit }}
        IN_MIN_SCORE: ${{ inputs.min-score }}
      run: |
        set -euo pipefail

        if ! [[ "$IN_MIN_SCORE" =~ ^[0-9]+$ ]]; then
          echo "::error::min-score must be a non-negative integer"; exit 1
        fi

        ARGS=("$IN_PATH" "--project" "$IN_PROJECT")
        [ -n "$IN_API_URL" ] && ARGS+=("--push" "$IN_API_URL")
        [ -n "$IN_JUNIT" ] && ARGS+=("--junit" "$IN_JUNIT")
        # we enforce the threshold ourselves when min-score is set
        if [ "$IN_NO_EXIT" = "true" ] || [ "$IN_MIN_SCORE" -gt 0 ]; then ARGS+=("--no-exit"); fi

        OUTPUT=$(testpulse "${ARGS[@]}" 2>&1 | tee /dev/stderr)
        SCORE=$(echo "$OUTPUT" | grep -oP 'Quality score:\s*\K\d+' || echo "0")
        echo "score=$SCORE" >> "$GITHUB_OUTPUT"

        {
          echo "## Testpulse — Quality score: ${SCORE}/100"
          echo ""
          echo '```'
          echo "$OUTPUT"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$IN_MIN_SCORE" -gt 0 ] && [ "$SCORE" -lt "$IN_MIN_SCORE" ]; then
          echo "::error::Testpulse score ${SCORE}/100 is below minimum ${IN_MIN_SCORE}"
          exit 1
        fi
